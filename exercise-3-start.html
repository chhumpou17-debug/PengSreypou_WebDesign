
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Layout</title>

    <style>
        .container {
            width: 600px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header,main,footer, .sidebar{
            padding: 1.5rem;
            border-radius: 0.5rem;
            color: white;
        }

        header {
            background: #1e90ff;
            box-shadow: 0 4px 0 #0077ea;
        }

        .content {
            display: flex;
            gap: 1rem;
            align-items: stretch;
        }

        main {
            background: #3cb371;
            box-shadow: 0 4px 0 #2f8d59;
            flex-grow: 3;
        }

        .sidebar {
            background: #ff6347;
            box-shadow: 0 4px 0 #e02200;
            flex-grow: 1;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .box {
            background: #2f8d59;
            box-shadow: 0 4px 0 #226741;
            border-radius: 0.5rem;
            width: 75px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            background: #4169e1;
            box-shadow: 0 4px 0 #1d44b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>header</header>

        <div class="content">

            <main>
                main

                <div class="items">
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                    <div class="box">item</div>
                </div>

            </main>

            <div class="sidebar">sidebar</div>

        </div>

        <footer>footer</footer>

    </div>

</body>
</html>
